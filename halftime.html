<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeddBA | Halftime</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/halftime.css">

</head>

<body>

<!-- ==========================
        HALFTIME HEADER
========================== -->

<section class="halftime-header">

    <div class="scoreboard">

        <span class="scoreboard-label">

            Wedding Basketball Association

        </span>

        <h1>HALFTIME</h1>

        <p>The Arena Never Sleeps</p>

    </div>

</section>

<!-- ==========================
        HALFTIME CONTENT
========================== -->

<section class="categories halftime-content">

    <div class="cards-grid">

        <!-- Skills Challenge -->

        <div class="category"
             onclick="window.location.href='player.html?video=wRPeNcz0wUs'">

            <img src="images/SKILLS.jpg" alt="Skills Challenge">

            <div class="category-content">

                <h3>SKILLS CHALLENGE</h3>

            </div>

        </div>

        <!-- Cooling Break -->

        <div class="category"
             onclick="window.location.href='player.html?video=c78Mq4kz3Ek'">

            <img src="images/HALFTIME2.jpg" alt="Cooling Break">

            <div class="play-icon">

                ▶

            </div>

            <div class="category-content">

                <h3>COOLING BREAK</h3>

            </div>

        </div>

        <!-- Bubble Madness -->

        <div class="category"
             onclick="window.location.href='player.html?video=pFRvp_ggFIU'">

            <img src="images/prova.png" alt="Bubble Madness">

            <div class="category-content">

                <h3>BUBBLE MADNESS</h3>

            </div>

        </div>

    </div>

</section>

<!-- ==========================
        HOME BUTTON
========================== -->

<div class="back-home">

    <button class="home-button"
            onclick="goHome()">

        ← Torna alla Home

    </button>

</div>

<!-- ==========================
        KEYBOARD
========================== -->

<script>

function goHome(){

    window.location.href = "index.html";

}

document.addEventListener("keydown", function(e){

    switch(e.key){

        case "Escape":

            e.preventDefault();

            goHome();

            break;

    }

});

</script>

</body>

</html>
