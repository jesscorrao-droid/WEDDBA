<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeddBA | Chiara & Dario</title>

    <!-- PWA -->

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#081528">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="WeddBA">

    <link rel="apple-touch-icon" href="images/icon-192.png">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/header.css">

    <link rel="stylesheet" href="css/hero.css">

    <link rel="stylesheet" href="css/cards.css">

    <link rel="stylesheet" href="css/footer.css">

    <link rel="stylesheet" href="css/pwa.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ==========================
         INSTALL APP
    =========================== -->

    <div id="install-banner">

        <div>

            🏀 Installa <strong>WeddBA</strong> sul tuo telefono

        </div>

        <button id="install-btn">

            Installa

        </button>

    </div>

    <!-- ==========================
         HEADER
    =========================== -->

    <header id="header">

        <div class="logo">

            <img src="images/logo.png" alt="WeddBA">

        </div>

    </header>

    <!-- ==========================
         HERO
    =========================== -->

    <section class="hero">

        <div class="overlay"></div>

        <div class="hero-content">

            <span class="league">

                WEDDING BASKETBALL ASSOCIATION

            </span>

            <div class="hero-date">

            6 GIUGNO 2026

            </div>

            <h1 class="hero-title">

                <span class="w">W</span><span class="edd">edd</span><span class="ba">BA</span>

            </h1>

            <p class="hero-subtitle">

                <span class="ball">🏀</span>

                A nostra immagine e somiglianza

            </p>

            <button class="hero-button">

                ▶ GUARDA IL TRAILER

            </button>

        </div>

    </section>

    <!-- ==========================
         CATEGORIE
    =========================== -->

    <section id="categories" class="categories">

        <div id="categoriesContainer"></div>

    </section>

    <!-- ==========================
         FOOTER
    =========================== -->

    <footer class="footer">

        <img src="images/logo.png"

             class="footer-logo"

             alt="WeddBA">

        <div class="footer-text">

            <p>WeddBA · Wedding Basketball Association</p>

            <p>Chiara ❤️ Dario · 6 giugno 2026</p>

        </div>

    </footer>

    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script src="data.js"></script>

    <script src="script.js"></script>

    <script src="install.js"></script>

    <script>

    window.addEventListener("load",()=>{

        const target=sessionStorage.getItem("returnTo");

        if(target){

            setTimeout(()=>{

                const card=document.getElementById(target);

                if(card){

                    card.scrollIntoView({

                        behavior:"smooth",

                        block:"center"

                    });

                }

            },200);

        }

    });

    document.querySelector(".hero-button").addEventListener("click",()=>{

        window.location.href="player.html?video=wLTiqjkjbIs";

    });

    if("serviceWorker" in navigator){

        window.addEventListener("load",()=>{

            navigator.serviceWorker.register("./sw.js")

            .then(()=>console.log("🏀 WeddBA Ready"))

            .catch(console.error);

        });

    }

    </script>

</body>

</html>
