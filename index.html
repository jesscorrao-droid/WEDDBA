<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeddBA | Chiara & Dario</title>

    <meta name="theme-color" content="#081528">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===========================
        HEADER
=========================== -->

<header id="header">

    <div class="logo">

        <img src="images/logo.png" alt="WeddBA">

    </div>

</header>

<!-- ===========================
          HERO
=========================== -->

<section class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <span class="league">
            WEDDING BASKETBALL ASSOCIATION
        </span>

        <div class="hero-date">
            24 LUGLIO 2026
        </div>

        <h1 class="hero-title">

            <span class="w">W</span><span class="edd">edd</span><span class="ba">BA</span>

        </h1>

        <p class="hero-subtitle">

            <span class="ball">🏀</span>

            A nostra immagine e somiglianza

        </p>

        <button class="hero-button">

            <span class="play">▶</span>

            GUARDA IL TRAILER

        </button>

    </div>

</section>

<!-- ===========================
        CATEGORIE
=========================== -->

<section id="categories" class="categories">

    <div id="categoriesContainer"></div>

</section>

<!-- ===========================
        FOOTER
=========================== -->

<footer class="footer">

    <img src="images/logo.png" alt="WeddBA" class="footer-logo">

    <div class="footer-text">

        <p>WeddBA · Wedding Basketball Association</p>

        <p>Chiara ❤️ Dario · 24 Luglio 2026</p>

    </div>

</footer>

<script src="data.js"></script>
<script src="script.js"></script>

<script>

window.addEventListener("load",()=>{

    const target=sessionStorage.getItem("returnTo");

    if(!target) return;

    setTimeout(()=>{

        const card=document.getElementById(target);

        if(card){

            card.scrollIntoView({

                behavior:"smooth",
                block:"center"

            });

        }

    },200);

});

</script>

<script>

document.querySelector(".hero-button").addEventListener("click",()=>{

    window.location.href="player.html?video=wLTiqjkjbIs";

});

</script>

</body>

</html>
